document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <button onclick=\"{{ toggleNav }}\" title=\"نمایش/پنهان‌سازی منو\" style=\"width:38px;height:38px;border-radius:10px;border:1px solid #e3e3e3;background:#fff;display:flex;align-items:center;justify-content:center;color:#484649;flex:none\" style-hover=\"background:#f7f7f9\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:8px;min-width:0;font-size:13px\">\n          <span class=\"crumb-root\" style=\"color:#9a9aa5;font-weight:500;white-space:nowrap\">زیرا مارکت<\u002Fspan>\n          <span class=\"crumb-root\" style=\"color:#cfcfd6\">/<\u002Fspan>\n          <span class=\"crumb-group\" style=\"color:#9a9aa5;font-weight:500;white-space:nowrap\">{{ crumbGroup }}<\u002Fspan>\n          <span class=\"crumb-group\" style=\"color:#cfcfd6\">/<\u002Fspan>\n          <span style=\"color:#23232d;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ crumbPage }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n        <div style=\"position:relative;width:240px;max-width:38vw\" class=\"crumb-group\">\n          <input placeholder=\"جستجوی مشتری، کد یا شماره تماس…\" style=\"width:100%;height:38px;background:#F2F2F2;border:1px solid transparent;border-radius:10px;padding:0 13px 0 38px;font-size:12.5px;color:#484649;outline:none\" style-focus=\"border-color:#D74E54;background:#fff\">\n          <svg style=\"position:absolute;left:12px;top:11px\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9aa5\" stroke-width=\"1.9\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.2-3.2\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <button onclick=\"{{ toggleNotif }}\" title=\"اعلان‌ها\" style=\"position:relative;width:38px;height:38px;border-radius:10px;border:1px solid #e3e3e3;background:#fff;display:flex;align-items:center;justify-content:center;color:#484649\" style-hover=\"background:#f7f7f9\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg><span style=\"position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#D74E54;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff\">{{ notifCount }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===================== DASHBOARD ===================== -->\n    <sc-if value=\"{{ is_dashboard }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"page\" data-screen-label=\"داشبورد مشتریان\" style=\"padding:26px 30px 40px\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap\">\n          <div>\n            <h1 style=\"font-size:22px;font-family:'Kalameh';font-weight:600\">داشبورد مشتریان<\u002Fh1>\n            <p style=\"font-size:13px;color:#777777;margin-top:5px\">نمای کلی مشتریان و درخواست‌ها<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n            <div style=\"display:flex;align-items:center;background:#fff;border:1px solid #e3e3e3;border-radius:11px;padding:3px;gap:2px\">\n              <sc-for list=\"{{ periodPills }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ p.pick }}\" style=\"font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:9px;background:{{ p.bg }};color:{{ p.fg }};box-shadow:{{ p.shadow }};white-space:nowrap\">{{ p.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n              <button onclick=\"{{ pickCustomRange }}\" title=\"انتخاب بازه\" style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;color:{{ customRangeColor }};background:{{ customRangeBg }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg>انتخاب بازه<\u002Fbutton>\n            <\u002Fdiv>\n            <button onclick=\"{{ go_register }}\" style=\"display:flex;align-items:center;gap:7px;background:linear-gradient(150deg,#DF6F73,#D74E54);color:#fff;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:11px;box-shadow:0 4px 12px rgba(215,78,84,.26)\" style-hover=\"filter:brightness(1.05)\"><span style=\"font-size:17px;line-height:1\">+<\u002Fspan>ثبت مشتری جدید<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:13px;font-family:'Kalameh';font-weight:600;margin:0 2px 12px;color:#777\">خلاصه آمار<\u002Fdiv>\n        <div class=\"kpi-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ k.go }}\" style=\"text-align:right;background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:18px 18px 16px;display:block\" style-hover=\"border-color:#e0bcbe;box-shadow:0 6px 16px rgba(215,78,84,.10)\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n                <div style=\"width:40px;height:40px;border-radius:12px;background:{{ k.bg }};color:{{ k.fg }};display:flex;align-items:center;justify-content:center\">\n                  <sc-if value=\"{{ k.i_order }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><rect x=\"7\" y=\"11\" width=\"3\" height=\"6\"><\u002Frect><rect x=\"13\" y=\"7\" width=\"3\" height=\"10\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ k.i_clock }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ k.i_loyal }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18a6 6 0 1 1 6 0M9 18h6M10 22h4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ k.i_new }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M19 8v6M22 11h-6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <\u002Fdiv>\n                <span style=\"display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:{{ k.trendColor }}\">{{ k.trend }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:5px\"><div style=\"font-size:24px;font-family:'Kalameh';font-weight:600;color:#23232d\">{{ k.value }}<\u002Fdiv><span style=\"font-size:12px;color:#aaa\">{{ k.unit }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#999;margin-top:4px\">{{ k.label }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:13px;font-family:'Kalameh';font-weight:600;margin:4px 2px 12px;color:#777\">وضعیت مالی و چک‌ها<\u002Fdiv>\n        <div class=\"fin-grid\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px\">\n          <sc-for list=\"{{ finCards }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:16px 17px 14px\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:13px\">\n                <div style=\"width:32px;height:32px;border-radius:10px;background:{{ f.bg }};color:{{ f.fg }};display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;font-weight:700\">{{ f.icon }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#999;line-height:1.5;min-width:0\">{{ f.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:4px\"><div class=\"tnum\" style=\"font-size:20px;font-family:'Kalameh';font-weight:600;color:{{ f.fg }}\">{{ f.value }}<\u002Fdiv><span style=\"font-size:11px;color:#aaa\">{{ f.unit }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #f4f4f4\"><span style=\"font-size:11px;color:#aaa;white-space:nowrap\">{{ f.subLabel }}<\u002Fspan><span class=\"tnum\" style=\"font-size:12px;font-weight:700;color:#484649;white-space:nowrap\">{{ f.subValue }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"dash-grid\" style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:18px;align-items:start\">\n          <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:18px 20px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n              <div style=\"font-size:14px;font-family:'Kalameh';font-weight:600\">مشتریان برتر<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"font-size:11.5px;color:#aaa\">بر اساس:<\u002Fspan>\n                <div style=\"display:flex;align-items:center;background:#f6f6f8;border-radius:9px;padding:2px\">\n                  <sc-for list=\"{{ topToggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n                    <button onclick=\"{{ t.pick }}\" style=\"font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.shadow }}\">{{ t.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ topCustomers }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ c.go }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:10px 0;border-bottom:1px solid #f4f4f4\">\n                <span class=\"tnum\" style=\"font-size:12px;font-weight:700;color:#b3b3bd;width:18px\">{{ c.rank }}<\u002Fspan>\n                <div style=\"width:34px;height:34px;border-radius:50%;background:{{ c.sw }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none\">{{ c.initial }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;text-align:right\"><div style=\"font-size:13px;font-weight:700;color:#23232d;text-decoration:underline;text-decoration-color:#e6c4c6;text-underline-offset:3px\">{{ c.name }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:12px;color:#777;white-space:nowrap\">{{ c.metric }}<\u002Fspan center\"><div class=\"tnum\" style=\"font-size:18px;font-family:'Kalameh';font-weight:600;color:#D74E54\">{{ g.discount }}<\u002Fdiv><div style=\"font-size:11px;color:#999;margin-top:3px\">تخفیف فعال<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:4px;padding:9px 14px;border-top:1px solid #f2f2f2;background:#fcfcfc\">\n                  <button onclick=\"{{ g.members }}\" title=\"اعضای گروه\" style=\"width:32px;height:32px;border-radius:8px;color:#999;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#f1f1f4;color:#484649\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"12\" cy=\"5\" r=\"1\"><\u002Fcircle><circle cx=\"12\" cy=\"19\" r=\"1\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n                  <button onclick=\"{{ g.edit }}\" title=\"ویرایش\" style=\"width:32px;height:32px;border-radius:8px;color:#999;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FBEDED;color:#D74E54\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"><\u002Fpath><path d=\"M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <button onclick=\"{{ g.settings }}\" title=\"تنظیمات تخفیف\" style=\"width:32px;height:32px;border-radius:8px;color:#999;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#f1f1f4;color:#484649\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <span style=\"margin-right:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#D74E54\">مشاهده جزئیات<svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== CUSTOMER PROFILE ===================== -->\n    <sc-if value=\"{{ is_profile }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"page\" data-screen-label=\"پروفایل مشتری\" style=\"padding:22px 30px 40px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap\">\n          <button onclick=\"{{ go_list }}\" style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#777;padding:8px 12px;border-radius:10px;border:1px solid #e3e3e3;background:#fff\" style-hover=\"background:#f7f7f9\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>بازگشت<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button onclick=\"{{ pf.assignMarketer }}\" style=\"display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#484649;border:1px solid #e3e3e3;background:#fff;padding:9px 13px;border-radius:10px\" style-hover=\"background:#f7f7f9\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 11h-6\"><\u002Fpath><\u002Fsvg>تخصیص بازاریاب<\u002Fbutton>\n          <button onclick=\"{{ pf.editProfile }}\" style=\"display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(150deg,#DF6F73,#D74E54);padding:9px 15px;border-radius:10px;box-shadow:0 4px 12px rgba(215,78,84,.24)\" style-hover=\"filter:brightness(1.05)\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"><\u002Fpath><path d=\"M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>ویرایش پروفایل<\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- identity header -->\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n          <div style=\"width:60px;height:60px;border-radius:17px;background:{{ pf.sw }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none\">{{ pf.initial }}<\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><h1 style=\"font-size:20px;font-family:'Kalameh';font-weight:600;color:#23232d\">{{ pf.name }}<\u002Fh1><span dir=\"ltr\" class=\"tnum\" style=\"font-size:12px;color:#999\">{{ pf.code }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap\">\n              <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:{{ pf.lvlFg }};background:{{ pf.lvlBg }};border-radius:7px;padding:4px 10px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ pf.lvlFg }}\"><\u002Fspan>{{ pf.level }}<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:{{ pf.statusFg }};background:{{ pf.statusBg }};border-radius:7px;padding:4px 10px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ pf.statusFg }}\"><\u002Fspan>{{ pf.status }}<\u002Fspan>\n              <span style=\"font-size:11.5px;color:#aaa\">سطح کاربر {{ pf.userLevel }} از ۳<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:18px;flex:none\">\n            <div style=\"text-align:center\"><div class=\"tnum\" style=\"font-size:18px;font-family:'Kalameh';font-weight:600;color:#23232d\">{{ pf.scoreValue }}<\u002Fdiv><div style=\"font-size:11px;color:#999;margin-top:2px\">امتیاز خوش‌حسابی<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:1px;height:34px;background:#ececec\"><\u002Fdiv>\n            <div style=\"text-align:center\"><div class=\"tnum\" style=\"font-size:18px;font-family:'Kalameh';font-weight:600;color:#23232d\">{{ pf.tenure }}<\u002Fdiv><div style=\"font-size:11px;color:#999;margin-top:2px\">مدت همکاری<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- tabs -->\n        <div style=\"display:flex;align-items:center;gap:4px;border-bottom:1px solid #ececec;margin-bottom:18px;overflow-x:auto\">\n          <sc-for list=\"{{ profTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ t.pick }}\" style=\"font-size:13px;font-weight:600;padding:11px 16px;color:{{ t.fg }};border-bottom:2.5px solid {{ t.border }};white-space:nowrap\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- TAB: info -->\n        <sc-if value=\"{{ ptab_info }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"prof-grid\" style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start\">\n            <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:20px 22px\">\n              <div style=\"font-size:14px;font-family:'Kalameh';font-weight:600;margin-bottom:16px\">اطلاعات هویتی و تماس<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px 24px\">\n                <sc-for list=\"{{ pf.infoFields }}\" as=\"f\" hint-placeholder-count=\"8\">\n                  <div><div style=\"font-size:11px;color:#aaa;margin-bottom:5px\">{{ f.label }}<\u002Fdiv><div dir=\"{{ f.dir }}\" class=\"tnum\" style=\"font-size:13px;font-weight:600;color:#484649;text-align:right\">{{ f.value }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #f2f2f2;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:54px;height:54px;border-radius:11px;background:#F4ECE3;display:flex;align-items:center;justify-content:center;flex:none;color:#A9744B\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><circle cx=\"9\" cy=\"9\" r=\"2\"><\u002Fcircle><path d=\"m21 15-3.5-3.5L9 20\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:12.5px;font-weight:600;color:#484649\">تصویر پروانه کسب<\u002Fdiv><div style=\"font-size:11px;color:#aaa;margin-top:2px\">شماره ۰۲۲۸۴۵۱ — صنف پوشاک<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ pf.viewLicense }}\" style=\"margin-right:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#D74E54;border:1px solid #f0d3d4;background:#fff;padding:8px 13px;border-radius:9px\" style-hover=\"background:#FBEDED\">نمایش تصویر<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:18px 20px\">\n                <div style=\"font-size:13px;font-family:'Kalameh';font-weight:600;margin-bottom:6px\">وضعیت کاربر<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#aaa;margin-bottom:14px\">تغییر وضعیت بر دسترسی ثبت سفارش اثر می‌گذارد.<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ pf.statusOpts }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <button onclick=\"{{ s.pick }}\" style=\"display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;border:1.5px solid {{ s.border }};background:{{ s.bg }};text-align:right\">\n                      <span style=\"width:18px;height:18px;border-radius:50%;border:2px solid {{ s.radio }};display:flex;align-items:center;justify-content:center;flex:none\"><span style=\"width:9px;height:9px;border-radius:50%;background:{{ s.radioDot }}\"><\u002Fspan><\u002Fspan>\n                      <div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:700;color:{{ s.titleFg }}\">{{ s.label }}<\u002Fdiv><div style=\"font-size:10.5px;color:#aaa;margin-top:1px\">{{ s.sub }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);padding:18px 20px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\"><div style=\"font-size:13px;font-family:'Kalameh';font-weight:600\">سطح کاربر<\u002Fdiv><button onclick=\"{{ pf.changeLevel }}\" style=\"font-size:11.5px;font-weight:700;color:#D74E54\">تغییر سطح<\u002Fbutton><\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#aaa;margin-bottom:12px\">سطح کاربر نوع تصاویر کاتالوگ نمایش‌داده‌شده را تعیین می‌کند.<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <sc-for list=\"{{ pf.levelDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n                    <div style=\"flex:1;text-align:center\"><div style=\"height:6px;border-radius:4px;background:{{ d.bar }}\"><\u002Fdiv><div style=\"font-size:10px;color:{{ d.fg }};font-weight:700;margin-top:6px\">{{ d.label }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;font-size:11.5px;color:#777;background:#FBFAFB;border-radius:10px;padding:10px 12px;line-height:1.7\">{{ pf.imageryNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TAB: credits -->\n        <sc-if value=\"{{ ptab_credits }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"prof-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start\">\n            <sc-for list=\"{{ pf.creditCards }}\" as=\"cc\" hint-placeholder-count=\"2\">\n              <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);overflow:hidden\">\n                <div style=\"padding:16px 20px;background:{{ cc.headBg }};display:flex;align-items:center;justify-content:space-between\">\n                  <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:38px;height:38px;border-radius:11px;background:#fff;color:{{ cc.fg }};display:flex;align-items:center;justify-content:center;flex:none\">{{ cc.icon }}<\u002Fdiv><div style=\"font-size:14px;font-family:'Kalameh';font-weight:600;color:{{ cc.fg }}\">{{ cc.title }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:11px;font-weight:700;color:{{ cc.fg }};background:#fff;border-radius:8px;padding:4px 10px\">{{ cc.levelLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:18px 20px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px\"><span style=\"color:#999\">سقف اعتبار<\u002Fspan><span class=\"tnum\" style=\"font-weight:700;color:#484649\">{{ cc.cap }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px\"><span style=\"color:#999\">اعتبار مصرف‌شده<\u002Fspan><span class=\"tnum\" style=\"font-weight:600;color:#C8841A\">{{ cc.used }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid #f4f4f4;margin-bottom:10px\"><span style=\"color:#999\">مانده اعتبار<\u002Fspan><span class=\"tnum\" style=\"font-weight:700;color:#1F8A5B\">{{ cc.remain }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:9px;border-radius:6px;background:#f1f1f4;overflow:hidden;margin-bottom:8px\"><div style=\"height:100%;width:{{ cc.pct }};border-radius:6px;background:{{ cc.fg }};animation:growBar .5s ease\"><\u002Fdiv><\u002Fdiv>\n                  <div class=\"tnum\" style=\"font-size:11px;color:#aaa;text-align:left margin-bottom:14px\">{{ cc.pct }} مصرف‌شده<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;margin-top:14px\">\n                    <button onclick=\"{{ cc.increase }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:{{ cc.fg }};padding:10px;border-radius:10px\" style-hover=\"filter:brightness(1.07)\"><span style=\"font-size:14px\">+<\u002Fspan>افزایش<\u002Fbutton>\n                    <button onclick=\"{{ cc.decrease }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#777;border:1px solid #e3e3e3;background:#fff;padding:10px;border-radius:10px\" style-hover=\"background:#f7f7f9\"><span style=\"font-size:14px\">−<\u002Fspan>کاهش<\u002Fbutton>\n                    <button onclick=\"{{ cc.history }}\" title=\"تاریخچه اعتبار\" style=\"width:40px;height:40px;border-radius:10px;border:1px solid #e3e3e3;background:#fff;color:#777;display:flex;align-items:center;justify-content:center;flex:none\" style-hover=\"background:#f7f7f9\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:12px;font-size:11px;color:#aaa;display:flex;align-items:center;gap:6px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A9744B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"><\u002Fpath><\u002Fsvg>{{ cc.guarantee }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:16px;border:1px solid #ececec;box-shadow:0 1px 3px rgba(20,20,40,.05);overflow:hidden;margin-top:16px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #f2f2f2;flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"width:34px;height:34px;border-radius:10px;background:#F4ECE3;color:#A9744B -weight:700;color:#484649\">{{ n.title }}<\u002Fdiv><div style=\"font-size:12px;color:#999;margin-top:3px;line-height:1.6\">{{ n.sub }}<\u002Fdiv><div style=\"font-size:11px;color:#b8b8c0;margin-top:5px\">{{ n.time }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeNotif }}\" style=\"padding:13px;font-size:12.5px;color:#D74E54;font-weight:700;border-top:1px solid #ececec\">علامت‌گذاری همه به‌عنوان خوانده‌شده<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== INVOICE / ORDER DETAILS MODAL ===================== -->\n  <sc-if value=\"{{ invoiceOpen }}\">\n    <div style=\"position:fixed;inset:0;z-index:85;direction:rtl;background:rgba(20,20,32,.5);display:flex;align-items:center;justify-content:center;padding:24px\" onclick=\"{{ closeInvoice }}\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(720px,100%);max-height:90vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #ececec;flex:none\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <div style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#DF6F73,#D74E54);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(215,78,84,.28)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div><div style=\"font-size:15px;font-family:'Kalameh';font-weight:600\">فاکتور فروش<\u002Fdiv><div dir=\ ing:10px 8px;text-align:left\">فی واحد<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;color:#9a9aa5;padding:10px 12px;text-align:left\">مبلغ کل<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ invoice.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:46px 1fr 70px 1.1fr 1.1fr;align-items:center;border-bottom:1px solid #f4f4f4\">\n                <div class=\"tnum\" style=\"padding:10px 12px;font-size:12px;color:#aaa\">{{ it.row }}<\u002Fdiv>\n                <div style=\"padding:10px 8px;font-size:12.5px;font-weight:600;color:#23232d\">{{ it.name }}<\u002Fdiv>\n                <div class=\"tnum\" style=\"padding:10px 8px;font-size:12px;color:#777;text-align:center\">{{ it.qty }}<\u002Fdiv>\n                <div class=\"tnum\" style=\"padding:10px 8px;font-size:12px;color:#777;text-align:left\">{{ it.unit }}<\u002Fdiv>\n                <div class=\"tnum\" style=\"padding:10px 12px;font-size:12.5px;font-weight:700;color:#23232d;text-align:left\">{{ it.amount }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-start\">\n            <div style=\"width:min(340px,100%)\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px\"><span style=\"color:#999\">جمع جزء<\u002Fspan><span class=\"tnum\" style=\"font-weight:600;color:#484649\">{{ invoice.sub }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ invoice.hasDisc }}\"><div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px\"><span style=\"color:#999\">تخفیف<\u002Fspan><span class=\"tnum\" style=\"font-weight:600;color:#D74E54\">{{ invoice.disc }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid #f0f0f0\"><span style=\"color:#999\">مالیات بر ارزش افزوده (۹٪)<\u002Fspan><span class=\"tnum\" style=\"font-weight:600;color:#484649\">{{ invoice.tax }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;font-size:14px\"><span style=\"font-family:'Kalameh';font-weight:600;color:#23232d\">مبلغ قابل پرداخت<\u002Fspan><span class=\"tnum\" style=\"font-family:'Kalameh';font-weight:600;color:#D74E54\">{{ invoice.grand }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid #ececec;flex:none\">\n          <button onclick=\"{{ printInvoice }}\" style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#fff;background:linear-gradient(150deg,#DF6F73,#D74E54);padding:11px 18px;border-radius:11px;box-shadow:0 4px 12px rgba(215,78,84,.24)\" style-hover=\"filter:brightness(1.05)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z\"><\u002Fpath><\u002Fsvg>چاپ فاکتور<\u002Fbutton>\n          <button onclick=\"{{ downloadInvoice }}\" style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#484649;border:1px solid #e3e3e3;background:#fff;padding:11px 16px;border-radius:11px\" style-hover=\"background:#f7f7f9\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg>دانلود PDF<\u002Fbutton>\n          <button onclick=\"{{ closeInvoice }}\" style=\"margin-right:auto;font-size:13px;font-weight:600;color:#777;border:1px solid #e3e3e3;background:#fff;padding:11px 18px;border-radius:11px\" style-hover=\"background:#f7f7f9\">بستن<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== INCREASE CREDIT FLOW ===================== -->\n  <sc-if value=\"{{ creditOpen }}\">\n    <div style=\"position:fixed;inset:0;z-index:86;direction:rtl;background:rgba(20,20,32,.5);display:flex;align-items:center;justify-content:center;padding:24px\" onclick=\"{{ closeCredit }}\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(560px,100%);max-height:90vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #ececec;flex:none\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <div style=\"width:38px;height:38px;border-radius:11px;background:{{ credit.headBg }};color:{{ credit.fg }};display:flex;align-items:center;justify-content:center;flex:none;font-size:18px\">{{ credit.icon }}<\u002Fdiv>\n            <div><div style=\"font-size:15px;font-family:'Kalameh';font-weight:600\">افزایش {{ credit.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#999;margin-top:1px\">سقف فعلی: {{ credit.curCap }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeCredit }}\" style=\"width:34px;height:34px;border-radius:9px;border:1px solid #e3e3e3;background:#fff;color:#777;display:flex;align-items:center;justify-content:center;flex:none\" style-hover=\"background:#f7f7f9\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n        <!-- stepper -->\n        <div style=\"display:flex;align-items:center;gap:0;padding:16px 22px 6px;flex:none\">\n          <sc-for list=\"{{ credit.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:9px;flex:none\"><span class=\"tnum\" style=\"width:26px;height:26px;border-radius:50%;background:{{ s.numBg }};color:{{ s.numFg }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none\">{{ s.num }}<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:{{ s.fg }};white-space:nowrap\">{{ s.label }}<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;height:2px;background:{{ s.lineBg }};margin:0 10px;min-width:18px\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;padding:14px 22px 18px\">\n          <!-- STEP 0 -->\n          <sc-if value=\"{{ credit.isStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;font-family:'Kalameh';font-weight:600;margin-bottom:10px\">مبلغ افزایش<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px\">\n              <sc-for list=\"{{ credit.presetCards }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ p.pick }}\" style=\"border:1.5px solid {{ p.border }};background:{{ p.bg }};border-radius:12px;padding:14px 8px;text-align:center\" style-hover=\"border-color:#d0d0d8\"><div class=\"tnum\" style=\"font-size:17px;font-family:'Kalameh';font-weight:600;color:{{ p.fg }}\">{{ p.label }}<\u002Fdiv><div style=\"font-size:11px;color:#aaa;margin-top:2px\">{{ p.sub }}<\u002Fdiv><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;font-family:'Kalameh';font-weight:600;margin-bottom:10px\">نوع ضمانت<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{},&quot;defaultRoute&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;list&quot;,&quot;profile&quot;,&quot;register&quot;,&quot;requests&quot;,&quot;review&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    route:'dashboard',\n    period:0, customRange:null,\n    listTab:0, pageSize:0,\n    colsOpen:false, hiddenCols:['email'],\n    groupOpen:null, newGroupOpen:false,\n    regStep:0,\n    rgOpen:true, rgType:'cheque', rgVals:{}, rgList:[], rgError:'',\n    revMkPct:3, revMk:'رضا کریمی',\n    topBy:0,\n    reqFilter:0,\n    profTab:0, custId:'CU-7362', custStatus:0, ledgerMode:0,\n    reqId:'RQT-0192',\n    invoiceOpen:false, invoiceNo:null,\n    creditOpen:false, creditKind:'cheque', creditStep:0, creditPreset:1, creditAmount:50000000, creditGuarantee:0,\n    notifOpen:false, navCollapsed:false, navOpen:false,\n    toast:'', toastOpen:false, toastKind:'ok',\n  };\n  _validRoutes = ['dashboard','list','profile','register','requests','review'];\n  componentDidMount(){\n    const h = (location.hash||'').replace('#','');\n    this._toRoute(this._validRoutes.includes(h) ? h : (this.props.defaultRoute || 'dashboard'));\n    this._hh = () => { const x=(location.hash||'').replace('#',''); if(this._validRoutes.includes(x)) this._toRoute(x); };\n    window.addEventListener('hashchange', this._hh);\n  }\n  componentWillUnmount(){ window.removeEventListener('hashchange', this._hh); }\n\n  fa(n){ return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }\n  grp(n){ return this.fa(String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '٬')); }\n  toast(m,kind){ this.setState({toast:m,toastOpen:true,toastKind:kind||'ok'}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toastOpen:false}),2600); }\n  stop=(e)=>{ e.stopPropagation(); };\n\n  _toRoute(route){ this.setState({route,notifOpen:false,navOpen:false,groupOpen:null,newGroupOpen:false,colsOpen:false}); }\n  closeCols=()=>this.setState({colsOpen:false});\n  go_dashboard=()=>this._toRoute('dashboard');\n  go_list=()=>this._toRoute('list');\n  go_requests=()=>this._toRoute('requests');\n  go_register=()=>{ this.setState({regStep:0}); this._toRoute('register'); };\n  go_alerts=()=>this.toast('صفحه همه هشدارها باز شد.');\n  toggleNav=()=>this.setState(s=>({navCollapsed:!s.navCollapsed, navOpen:!s.navOpen}));\n  closeNav=()=>this.setState({navOpen:false});\n  toggleNotif=()=>this.setState(s=>({notifOpen:!s.notifOpen}));\n  closeNotif=()=>this.setState({notifOpen:false});\n  pickPeriod=(i)=>()=>this.setState({period:i,customRange:null});\n  pickCustomRange=()=>{ this.setState({customRange:'بازه دلخواه',period:-1}); this.toast('بازه سفارشی اعمال شد.'); };\n  setPageSize=(i)=>()=>this.setState({pageSize:i});\n  pagePrev=()=>this.toast('صفحه قبلی.');\n  pageNext=()=>this.toast('صفحه بعدی.');\n  openFilterPanel=()=>this.toast('پنل فیلتر باز شد.');\n  exportExcel=()=>this.toast('خروجی اکسل از نمای فعلی آماده شد.');\n  newGroup=()=>this.setState({newGroupOpen:true, listTab:1, groupOpen:null, notifOpen:false});\n  closeNewGroup=()=>this.setState({newGroupOpen:false});\n  submitNewGroup=()=>{ this.setState({newGroupOpen:false}); this.toast('گروه مشتریان جدید ایجاد شد ✓'); };\n  openGroup=(code)=>()=>this.setState({groupOpen:code, newGroupOpen:false, notifOpen:false});\n  closeGroup=()=>this.setState({groupOpen:null});\n\n  _groupDefs(){\n    return [\n      {code:'CG-732698', name:'پوشاک تهران بزرگ', count:824, discount:9, lvl:'سطح ۳', mk:'رضا کریمی', mkPct:3, chq:'سطح ۵ (راس تا ۵ ماه)', gold:'سطح ۴', st:'فعال'},\n      {code:'CG-732701', name:'عمده‌فروشان شمال', count:120, discount:1, lvl:'سطح ۲', mk:'مهدی رشیدی', mkPct:2, chq:'سطح ۳ (راس تا ۳ ماه)', gold:'سطح ۲', st:'فعال'},\n      {code:'CG-732714', name:'بازار مرکزی', count:309, disc ], lvlBg:lv[2], status:us[0], stFg:us[1], stBg:us[2],\n          mkSw:mkSw[c.mk]||'#d4d4dc', open:this._openCust(c.code) }; }),\n      memberCount:this.fa(members.length),\n      addMember:()=>this.toast('افزودن کاربر به گروه «'+g.name+'».'),\n      editGroup:()=>this.toast('ویرایش گروه «'+g.name+'» باز شد.'),\n    };\n  }\n  _newGroupForm(){\n    return {\n      fields:[\n        {label:'کد گروه', ph:'CG-732760', dir:'ltr', span:'auto', kind:'input'},\n        {label:'نام گروه', ph:'مثلاً پوشاک اصفهان', dir:'rtl', span:'auto', kind:'input'},\n        {label:'سطح کاربران گروه', value:'سطح ۲', span:'auto', kind:'select'},\n        {label:'نام بازاریاب', value:'انتخاب بازاریاب', span:'auto', kind:'select'},\n        {label:'درصد بازاریاب', ph:'۳', dir:'rtl', span:'auto', kind:'input'},\n        {label:'درصد تخفیف گروه', ph:'۹', dir:'rtl', span:'auto', kind:'input'},\n        {label:'سطح اعتبار چک', value:'سطح ۴ (راس تا ۴ ماه)', span:'auto', kind:'select'},\n        {label:'سطح اعتبار طلایی', value:'سطح ۳', span:'auto', kind:'select'},\n        {label:'وضعیت کاربران گروه', value:'فعال', span:'1/-1', kind:'select'},\n      ].map(f=>({ ...f, isInput:f.kind==='input', isSelect:f.kind==='select', pick:()=>this.toast('انتخاب '+f.label+'.') })),\n    };\n  }\n  openInvoice=(no)=>(e)=>{ if(e&&e.stopPropagation)e.stopPropagation(); this.setState({invoiceOpen:true, invoiceNo:no}); };\n  closeInvoice=()=>this.setState({invoiceOpen:false});\n  printInvoice=()=>this.toast('فاکتور برای چاپ آماده شد ✓');\n  downloadInvoice=()=>this.toast('فایل PDF فاکتور دانلود شد ✓');\n\n  _orderDefs(){\n    return [\n      {no:'PO-982032', date:'۱۴۰۴/۰۹/۱۲', settle:'۱۴۰۴/۰۹/۱۲', pay:'cash', discount:200000, items:[\n        {name:'ست لباس خواب ساتن', qty:12, unit:398000},\n        {name:'سوتین بدون فنر دانتل', qty:8, unit:286000},\n        {name:'تاپ بندی کشی', qty:6, unit:142000} ]},\n      {no:'PO-981774', date:'۱۴۰۴/۰۸/۲۸', settle:'۱۴۰۴/۱۰/۲۸', pay:'cheque', discount:1500000, items:[\n        {name:'ربدوشامبر حریر بلند', qty:40, unit:512000},\n        {name:'پیراهن خواب ویسکوز', qty:60, unit:345000},\n        {name:'شورت زنانه نخی (بسته ۳ عددی)', qty:80, unit:168000} ]},\n      {no:'PO-981520', date:'۱۴۰۴/۰۸/۱۵', settle:'—', pay:'credit', discount:0, items:[\n        {name:'لگ راحتی مودال', qty:36, unit:198000},\n        {name:'تاپ بندی کشی', qty:48, unit:142000} ]},\n      {no:'PO-981133', date:'۱۴۰۴/۰۷/۳۰', settle:'۱۴۰۴/۰۹/۳۰', pay:'cheque', discount:2000000, items:[\n        {name:'بوکسر مردانه نخی', qty:120, unit:224000},\n        {name:'ست لباس خواب ساتن', qty:80, unit:398000},\n        {name:'ربدوشامبر حریر بلند', qty:40, unit:512000} ]},\n      {no:'PO-980845', date:'۱۴۰۴/۰۷/۱۲', settle:'۱۴۰۴/۰۷/۱۲', pay:'cash', discount:300000, items:[\n        {name:'پیراهن خواب ویسکوز', qty:36, unit:345000},\n        {name:'سوتین بدون فنر دانتل', qty:24, unit:286000} ]},\n      {no:'PO-980320', date:'۱۴۰۴/۰۶/۲۵', settle:'—', pay:'credit', discount:0, items:[\n        {name:'ست لباس خواب ساتن', qty:100, unit:398000},\n        {name:'ربدوشامبر حریر بلند', qty:80, unit:512000},\n        {name:'بوکسر مردانه نخی', qty:60, unit:224000} ]},\n    ];\n  }\n  _calcOrder(o){ const sub=o.items.reduce((s,it)=>s+it.qty*it.unit,0); const disc=o.discount||0; const tax=Math.round((sub-disc)*0.09); return {sub, disc, tax, grand:sub-disc+tax}; }\n  _invoice(){\n    const o=this._orderDefs().find(x=>x.no===this.state.invoiceNo); if(!o) return null;\n    const t=this._calcOrder(o);\n    const all=this._customers(); const c=all.find(x=>x.code===this.state.custId)||all[0];\n    const payMap={ cash:['نقدی','#1F8A5B','#E8F5EF'], cheque:['چکی','#8E6CB0','#F1ECF7'], credit:['اعتباری','#2A6FDB','#E8F0FB'] };\n    const p=payMap[o.pay]; const paid=o.settle!=='—';\n    return {\n      no:o.no, date:o.date,\n      statusLabel:paid?'تسویه‌شده':'در انتظار تسویه', statusFg:paid?'#1F8A5B':'#C8841A', statusBg:paid?'#E8F5EF':'#FDF3E2',\n      customerName:c.name, customerCode:c.code, address:'تهران
