<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مدیریت محتوا — زیرا مارکت</title>
  <style>
    /* =========================================================
       Design tokens — mirrored from src/shared/styles/*
       theme-colors / theme-typography / theme-spacing /
       theme-radius / theme-shadow / theme-fonts
       ========================================================= */
    :root {
      /* theme-colors.css */
      --color-primary: #d74e54;
      --color-primary-focused: #d74e5429;
      --color-natural: #1f1f1f;
      --color-natural-variant: #e6e1e5;
      --color-error: #bf0329;
      --color-warning: #f7941e;
      --color-success: #006c50;
      --color-success-container: #bbffe2;
      --color-primary-container: #fbdfe1;
      --color-info: #242f94;
      --color-info-container: #ced1f3;
      --color-link: #646464;
      --color-inverse-surface: #292929;
      --color-inverse-surface-variant: #e6e1e5;
      --color-surface-container-lowest: #ffffff;
      --color-surface-container-high: #f2f2f2;
      --color-surface-container-highest: #e6e6e6;
      --color-on-surface: #141414;
      --color-on-surface-hover: rgba(0, 0, 0, 0.08);
      --color-on-surface-variant: #484649;
      --color-on-surface-cotainer: #002116;
      --color-on-primary: #ffffff;
      --color-on-primary-container: #430f12;
      --color-on-info: #ffffff;
      --color-on-info-container: #0c1031;
      --color-on-inverse-surface: #f2f2f2;
      --color-error-container: #ffedeb;
      --color-on-error-container: #410007;
      --color-on-success-container: #002116;
      --color-warning-container: #fde3c4;
      --color-on-warning-container: #3b2102;
      --color-outline: #787878;
      --color-outline-variant: #c7c7c7;
      --color-background: var(--color-surface-container-high);
      --color-card: var(--color-surface-container-lowest);
      --body-background-color: var(--color-surface-container-lowest);
      --scrollbar-background-color: #e3e3e3;
      --scrollbar-background-thumb: var(--color-primary);

      /* semantic aliases used by prototype screens */
      --color-success-strong: #1f8a5b;
      --color-success-soft: #e8f5ef;
      --color-warning-strong: #c8841a;
      --color-warning-soft: #fdf3e2;
      --color-info-strong: #2a6fdb;
      --color-info-soft: #e8f0fb;
      --color-purple: #8e6cb0;
      --color-purple-soft: #f1ecf7;
      --color-muted: #9a9aa5;
      --color-muted-soft: #f1f1f4;

      /* theme-typography.css */
      --text-label-sm: 12px;
      --text-label-md: 14px;
      --text-label-lg: 16px;
      --text-body-sm: 12px;
      --text-body-md: 14px;
      --text-body-lg: 16px;
      --text-title-sm: 14px;
      --text-title-md: 16px;
      --text-title-lg: 22px;
      --text-headline-sm: 24px;
      --text-headline-md: 28px;
      --text-headline-lg: 32px;

      /* theme-spacing.css */
      --spacing-sm: 8px;
      --spacing-md: 10px;
      --spacing-lg: 12px;
      --spacing-xl: 16px;
      --spacing-2xl: 24px;
      --spacing-3xl: 32px;
      --spacing-4xl: 48px;
      --spacing-layout: 40px;

      /* theme-radius.css */
      --radius-button-sm: 8px;
      --radius-button-md: 12px;
      --radius-button-lg: 16px;
      --radius-card-sm: 12px;
      --radius-card-md: 16px;
      --radius-card-lg: 20px;
      --radius-container-xl: 24px;
      --radius-container-lg: 20px;
      --radius-container-md: 16px;
      --radius-container-sm: 12px;
      --radius-container-xs: 8px;

      /* theme-shadow.css */
      --shadow-xl: #00000014;
      --shadow-card: 0 1px 3px rgba(20, 20, 40, 0.05);
      --shadow-primary: 0 4px 12px rgba(215, 78, 84, 0.26);

      /* theme-fonts.css + app/globals.css */
      --font-family-yekan: "YekanBakh", Arial, Helvetica, sans-serif;
      --font-family-display: "Kalameh", "YekanBakh", Arial, Helvetica, sans-serif;
      --font-family-oxanium: "Oxanium", sans-serif;
      --font-family-helvetica: "Helvetica", "Helvetica Neue", Arial, sans-serif;
    }

    @font-face {
      font-family: "YekanBakh";
      src: url("./YekanBakh-Regular.woff") format("woff");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "YekanBakh";
      src: url("./YekanBakh-SemiBold.woff") format("woff");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: "YekanBakh";
      src: url("./YekanBakh-Bold.woff") format("woff");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("./Kalameh-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("./Kalameh-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("./Kalameh-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-family-yekan);
      background: var(--color-surface-container-high);
      color: var(--color-on-surface-variant);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input { font-family: inherit; }
    h1, h2, h3 { font-family: var(--font-family-display); color: var(--color-on-surface); }
    .tnum { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--color-outline-variant); border-radius: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growBar { from { width: 0; } }
    @keyframes toastIn {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .app {
      display: flex;
      flex-direction: row-reverse;
      min-height: 100vh;
      width: 100%;
      direction: rtl;
    }

    /* Sidebar — aligned with SubSidebar visual language */
    .sidebar {
      width: 220px;
      flex: none;
      background: var(--color-surface-container-high);
      padding: var(--spacing-sm);
      position: sticky;
      top: 0;
      height: 100vh;
      transition: width .2s ease, opacity .2s ease;
    }
    .sidebar-inner {
      background: var(--color-surface-container-lowest);
      border-radius: var(--radius-card-lg);
      height: 100%;
      padding: var(--spacing-sm);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-lg);
      padding: var(--spacing-xl) var(--spacing-xl) var(--spacing-lg);
    }
    .sidebar-brand-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-card-sm);
      background: linear-gradient(150deg, #df6f73, var(--color-primary));
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-primary);
      flex: none;
    }
    .sidebar-brand h2 {
      font-size: var(--text-title-md);
      font-weight: 700;
      line-height: 1.3;
    }
    .sidebar-brand p {
      font-size: var(--text-label-sm);
      color: var(--color-outline);
      margin-top: 2px;
    }
    .nav-section-title {
      font-size: var(--text-label-sm);
      color: var(--color-outline);
      padding: var(--spacing-sm) var(--spacing-xl);
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-sm) var(--spacing-xl);
      border-radius: var(--radius-container-md);
      font-size: var(--text-label-lg);
      color: var(--color-outline);
      transition: background .14s, color .14s;
      text-align: right;
    }
    .nav-item:hover { background: var(--color-primary-focused); color: var(--color-primary); }
    .nav-item.active {
      background: var(--color-primary-focused);
      color: var(--color-primary);
      font-weight: 600;
    }
    .nav-item .badge {
      margin-right: auto;
      font-size: 11px;
      font-weight: 700;
      background: var(--color-primary-container);
      color: var(--color-primary);
      border-radius: var(--radius-button-sm);
      padding: 2px 8px;
    }
    .sidebar-user {
      margin-top: auto;
      padding: var(--spacing-lg) var(--spacing-xl);
      border-top: 1px solid var(--color-outline-variant);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #c77fa6;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex: none;
    }

    /* Main */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-lg);
      padding: var(--spacing-md) 22px;
      border-bottom: 1px solid var(--color-outline-variant);
      background: var(--color-surface-container-lowest);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--color-outline-variant);
      background: var(--color-surface-container-lowest);
      color: var(--color-on-surface-variant);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--color-surface-container-high); }
    .crumbs {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; min-width: 0;
    }
    .crumbs .muted { color: var(--color-muted); font-weight: 500; white-space: nowrap; }
    .crumbs .sep { color: var(--color-outline-variant); }
    .crumbs .current {
      color: var(--color-on-surface);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-field {
      position: relative;
      width: 240px;
      max-width: 38vw;
    }
    .search-field input {
      width: 100%;
      height: 38px;
      background: var(--color-surface-container-high);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 13px 0 38px;
      font-size: 12.5px;
      color: var(--color-on-surface-variant);
      outline: none;
    }
    .search-field input:focus {
      border-color: var(--color-primary);
      background: var(--color-surface-container-lowest);
    }
    .search-field svg {
      position: absolute; left: 12px; top: 11px; pointer-events: none;
    }
    .notif-wrap { position: relative; }
    .notif-dot {
      position: absolute; top: -5px; left: -5px;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 9px;
      background: var(--color-primary);
      color: #fff;
      font-size: 10.5px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
    }

    .page {
      padding: 26px 30px 40px;
      animation: fadeUp .28s ease;
    }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .page-head h1 {
      font-size: var(--text-title-lg);
      font-weight: 600;
    }
    .page-head p {
      font-size: 13px;
      color: var(--color-outline);
      margin-top: 5px;
    }
    .actions { display: flex; align-items: center; gap: 10px; flex: none; flex-wrap: wrap; }

    .pill-group {
      display: flex;
      align-items: center;
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-outline-variant);
      border-radius: 11px;
      padding: 3px;
      gap: 2px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 9px;
      color: var(--color-outline);
      white-space: nowrap;
    }
    .pill.active {
      background: var(--color-surface-container-lowest);
      color: var(--color-on-surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .pill .count { margin-right: 6px; font-size: 11px; opacity: .7; }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(150deg, #df6f73, var(--color-primary));
      color: var(--color-on-primary);
      font-size: 13.5px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 11px;
      box-shadow: var(--shadow-primary);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-outline-variant);
      color: var(--color-on-surface-variant);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 11px;
    }
    .btn-secondary:hover { background: var(--color-surface-container-high); }

    .card {
      background: var(--color-surface-container-lowest);
      border-radius: var(--radius-card-md);
      border: 1px solid #ececec;
      box-shadow: var(--shadow-card);
    }
    .card-pad { padding: 18px 20px; }

    /* KPI / Summary cards — match SummaryCard */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--spacing-xl);
      margin-bottom: 18px;
    }
    .kpi {
      text-align: right;
      background: var(--color-surface-container-lowest);
      border-radius: var(--radius-card-lg);
      padding: var(--spacing-2xl);
      box-shadow: none;
      border: none;
      display: block;
      width: 100%;
    }
    .kpi:hover { background: color-mix(in srgb, var(--color-primary) 4%, white); }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-direction: row-reverse;
    }
    .kpi-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-card-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .kpi-value {
      font-size: var(--text-headline-sm);
      font-family: var(--font-family-display);
      font-weight: 600;
      color: var(--color-on-surface);
      text-align: right;
    }
    .kpi-label {
      font-size: var(--text-label-md);
      color: var(--color-on-surface-variant);
      margin-top: 4px;
      text-align: right;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: var(--spacing-xl);
      margin-bottom: 18px;
    }

    .section-title {
      font-size: var(--text-title-md);
      font-family: var(--font-family-display);
      font-weight: 600;
      color: var(--color-on-surface);
    }
    .alert-count {
      font-size: 11px;
      font-weight: 700;
      background: var(--color-error-container);
      color: var(--color-primary);
      border-radius: 8px;
      padding: 3px 9px;
    }
    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-sm);
      padding: var(--spacing-lg);
      border-radius: var(--radius-container-md);
      background: var(--color-surface-container-lowest);
      margin-bottom: var(--spacing-sm);
    }
    .alert-list {
      background: var(--color-surface-container-high);
      border-radius: var(--radius-container-md);
      padding: var(--spacing-sm);
      margin-top: var(--spacing-sm);
    }
    .alert-title { font-size: var(--text-label-lg); color: var(--color-on-surface); }
    .alert-desc { font-size: var(--text-label-md); color: var(--color-outline); margin-top: 2px; }
    .link-all {
      width: 100%;
      margin-top: var(--spacing-lg);
      font-size: var(--text-label-md);
      color: var(--color-on-surface-variant);
      font-weight: 600;
      text-align: center;
      padding: 4px;
    }
    .link-all:hover { color: var(--color-primary); }

    .status-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) 1fr minmax(0, 120px);
      align-items: center;
      gap: var(--spacing-lg);
      min-height: 40px;
    }
    .status-label { font-size: var(--text-label-lg); color: var(--color-on-surface); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-bar {
      display: flex; align-items: center; gap: var(--spacing-sm);
    }
    .progress {
      flex: 1;
      height: 6px;
      border-radius: 6px;
      background: var(--color-surface-container-highest);
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      border-radius: 6px;
      background: var(--color-success-strong);
      animation: growBar .5s ease;
    }
    .status-pct { font-size: var(--text-label-sm); color: var(--color-outline); flex: none; }
    .status-value { font-size: var(--text-label-md); color: var(--color-outline); text-align: left; }

    .qa-title {
      font-size: var(--text-title-md);
      font-family: var(--font-family-display);
      font-weight: 600;
      margin: 4px 2px 12px;
      color: var(--color-on-surface);
    }
    .qa-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .qa-item {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--color-surface-container-lowest);
      border-radius: var(--radius-card-sm);
      padding: 16px;
      text-align: right;
      border: 1px solid transparent;
    }
    .qa-item:hover {
      border-color: color-mix(in srgb, var(--color-primary) 35%, white);
      box-shadow: 0 6px 16px rgba(215, 78, 84, 0.08);
    }
    .qa-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-card-sm);
      display: flex; align-items: center; justify-content: center;
      flex: none;
      font-size: 19px;
      background: var(--color-surface-container-high);
    }
    .qa-label { font-size: 13.5px; font-weight: 600; color: var(--color-on-surface); }
    .qa-sub { font-size: 11.5px; color: var(--color-muted); margin-top: 2px; }

    /* Tables */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .table-wrap { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    .table-min { min-width: 880px; }
    .table-head, .table-row {
      display: grid;
      grid-template-columns: 130px 1.4fr 150px 70px 1fr 110px 1.2fr 40px;
      align-items: center;
    }
    .table-head {
      background: #fafafa;
      border-bottom: 1px solid #efefef;
    }
    .table-head > div {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-muted);
      padding: 13px 14px;
      white-space: nowrap;
    }
    .table-head > div:first-child { padding-right: 18px; }
    .table-row {
      border-bottom: 1px solid #f4f4f4;
      cursor: pointer;
    }
    .table-row:hover { background: #fcf6f6; }
    .table-row > div { padding: 13px 14px; }
    .table-row > div:first-child { padding-right: 18px; }
    .id-link { font-size: 12.5px; font-weight: 700; color: var(--color-primary); }
    .cust {
      display: flex; align-items: center; gap: 9px;
    }
    .cust-av {
      width: 32px; height: 32px;
      border-radius: 9px;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex: none;
    }
    .cust-name { font-size: 12.5px; font-weight: 600; color: var(--color-on-surface); white-space: nowrap; }
    .lvl {
      display: inline-flex;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 7px;
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-dot i {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .table-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 18px;
      border-top: 1px solid #efefef;
      flex-wrap: wrap;
    }

    /* Detail */
    .detail-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .stepper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      padding: 22px 26px;
      margin-bottom: 16px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      flex: 1;
      position: relative;
      z-index: 2;
    }
    .step-dot {
      width: 38px; height: 38px;
      border-radius: 50%;

            <div style="display:flex;align-items:center;gap:11px">
              <div style="width:38px;height:38px;border-radius:11px;background:${ic[0]};color:${ic[1]};display:flex;align-items:center;justify-content:center">${blockIcon(b.kind)}</div>
              <div><div style="font-size:15px;font-weight:600">ویرایش بلوک</div><div style="font-size:11.5px;color:var(--color-muted)">${b.name}</div></div>
            </div>
            <button class="icon-btn" onclick="closeEditor()">✕</button>
          </div>
          <div style="flex:1;overflow-y:auto;padding:18px 20px">${body}</div>
          <div style="display:flex;gap:10px;padding:14px 20px;border-top:1px solid #ececec">
            <button onclick="publishBlock()" style="flex:1;padding:12px;border-radius:12px;background:linear-gradient(150deg,#3FA776,var(--color-success-strong));color:#fff;font-weight:500">انتشار</button>
            <button class="btn-secondary" onclick="saveBlock()">ذخیره پیش‌نویس</button>
          </div>
        </div>
      </div>`;
  }

  function renderOverlays() {
    let html = '';
    if (state.notifOpen) {
      const notifs = [
        { icon: '📝', bg: 'var(--color-warning-soft)', fg: 'var(--color-warning-strong)', title: '۲ بلوک صفحه اصلی در حالت پیش‌نویس', sub: 'تغییرات هنوز منتشر نشده‌اند.', time: '۳۰ دقیقه پیش', go: "closeNotif();go_home()" },
        { icon: '❓', bg: 'var(--color-purple-soft)', fg: 'var(--color-purple)', title: '۳ سوال جدید از مشتریان دریافت شد', sub: 'برای افزودن به سوالات متداول بررسی کنید.', time: '۲ ساعت پیش', go: "closeNotif();go_faq()" },
        { icon: '📜', bg: 'var(--color-info-soft)', fg: 'var(--color-info-strong)', title: 'مجوز استاندارد در حالت پیش‌نویس است', sub: 'برای نمایش در سایت منتشر کنید.', time: 'دیروز', go: "closeNotif();go_certs()" },
        { icon: '✅', bg: 'var(--color-success-soft)', fg: 'var(--color-success-strong)', title: 'مقاله «راهنمای انتخاب سایز» منتشر شد', sub: '۱٬۸۴۰ بازدید تاکنون.', time: '۲ روز پیش', go: "closeNotif();go_blog()" },
      ];
      html += `<div class="overlay" onclick="closeNotif()">
        <div onclick="event.stopPropagation()" style="position:absolute;top:56px;left:20px;width:min(360px,calc(100vw - 32px));max-height:72vh;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid #ececec">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #ececec"><div style="font-size:15px;font-weight:700">اعلان‌ها</div><span style="font-size:12px;color:#fff;background:var(--color-primary);border-radius:8px;padding:3px 9px;font-weight:700">۴ جدید</span></div>
          <div style="flex:1;overflow-y:auto">${notifs.map((n) => `
            <div onclick="${n.go}" style="display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid #f4f4f4;cursor:pointer">
              <div style="width:36px;height:36px;border-radius:10px;background:${n.bg};color:${n.fg};display:flex;align-items:center;justify-content:center;font-size:16px">${n.icon}</div>
              <div><div style="font-size:13px;font-weight:700">${n.title}</div><div style="font-size:12px;color:var(--color-muted);margin-top:3px;line-height:1.6">${n.sub}</div><div style="font-size:11px;color:#b8b8c0;margin-top:5px">${n.time}</div></div>
            </div>`).join('')}</div>
          <button onclick="closeNotif()" style="padding:13px;font-size:12.5px;color:var(--color-primary);font-weight:700;border-top:1px solid #ececec;width:100%">علامت‌گذاری همه به‌عنوان خوانده‌شده</button>
        </div>
      </div>`;
    }
    if (state.editorOpen) html += editDrawerContent();
    if (state.faqAddOpen) {
      const cats = faqCatLabels().map((l, i) => {
        const sel = state.faqAddCat === i; const cc = faqCatColor(i);
        return `<button onclick="setFaqAddCat(${i})" style="font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;border:1.5px solid ${sel ? cc[0] : '#e6e6ea'};background:${sel ? cc[1] : '#fff'};color:${sel ? cc[0] : '#777'}">${l}</button>`;
      }).join('');
      html += `<div class="modal-center" onclick="closeFaqAdd()"><div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #ececec">
          <div style="font-size:15px;font-weight:600">ثبت سوال جدید</div>
          <button class="icon-btn" onclick="closeFaqAdd()">✕</button>
        </div>
        <div style="padding:20px 22px">
          <label class="field-label">گروه مرتبط</label><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">${cats}</div>
          <label class="field-label">سوال</label><input class="field-input" placeholder="متن سوال را وارد کنید" style="margin-bottom:16px">
          <label class="field-label">پاسخ</label><textarea class="field-textarea" placeholder="پاسخ کامل را بنویسید"></textarea>
        </div>
        <div style="display:flex;gap:10px;padding:14px 22px;border-top:1px solid #ececec">
          <button class="btn-primary" style="flex:1;justify-content:center" onclick="submitFaq()">ثبت سوال</button>
          <button class="btn-secondary" onclick="closeFaqAdd()">انصراف</button>
        </div>
      </div></div>`;
    }
    if (state.previewOpen) {
      const previewProducts = productDefs().slice(0, 3).map((p, i) => ({ name: p.name, price: grp(p.price), sw: sw(i) }));
      html += `<div class="modal-center" onclick="closePreview()"><div class="modal" style="width:min(420px,100%);max-height:90vh;display:flex;flex-direction:column" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #ececec">
          <div style="display:flex;align-items:center;gap:9px"><span style="width:9px;height:9px;border-radius:50%;background:var(--color-success-strong)"></span><span style="font-size:12.5px;font-weight:700">پیش‌نمایش فروشگاه</span></div>
          <button class="icon-btn" onclick="closePreview()">✕</button>
        </div>
        <div style="flex:1;overflow-y:auto;background:#f4f4f6">
          <div style="background:#fff;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><div style="font-weight:700;color:var(--color-primary)">زیرا مارکت</div><span style="color:var(--color-muted)">🔍 🛒</span></div>
          <div style="margin:12px;height:150px;border-radius:14px;background:linear-gradient(120deg,#DF6F73,var(--color-primary));padding:20px;color:#fff">
            <div style="font-size:17px;font-weight:700;margin-bottom:6px">کالکشن پاییز ۱۴۰۴</div>
            <div style="font-size:11.5px;opacity:.92;line-height:1.7">جدیدترین مجموعه پوشاک راحتی با تخفیف ویژه</div>
            <button style="margin-top:12px;font-size:11px;font-weight:700;background:#fff;color:var(--color-primary);padding:7px 14px;border-radius:8px">مشاهده کالکشن</button>
          </div>
          <div style="padding:4px 12px 12px"><div style="font-size:13px;font-weight:700;margin-bottom:10px">کالاهای جدید</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${previewProducts.map((p) => `
              <div style="background:#fff;border-radius:11px;overflow:hidden;border:1px solid #eee"><div style="height:74px;background:${p.sw}"></div><div style="padding:7px 8px"><div style="font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div class="tnum" style="font-size:9.5px;color:var(--color-primary);font-weight:700">${p.price} ت</div></div></div>`).join('')}
          </div></div>
          <div style="margin:0 12px 12px;background:#fff;border-radius:14px;padding:16px;border:1px solid #eee;text-align:center">
            <div style="font-size:13px;font-weight:700;margin-bottom:7px">معرفی برند زیرا</div>
            <div style="font-size:11px;color:var(--color-outline);line-height:1.9">تولیدکننده پوشاک راحتی و زیرپوش با بیش از یک دهه تجربه.</div>
            <button style="margin-top:12px;font-size:11px;font-weight:700;background:var(--color-primary-container);color:var(--color-primary);padding:8px 16px;border-radius:9px">درباره ما</button>
          </div>
        </div>
      </div></div>`;
    }
    if (state.confirmOpen) {
      html += `<div class="modal-center" onclick="closeConfirm()"><div class="modal modal-sm" onclick="event.stopPropagation()">
        <div style="padding:24px 22px 8px;text-align:center">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--color-error-container);color:var(--color-primary);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px">🗑</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:7px">حذف محتوا</div>
          <div style="font-size:12.5px;color:var(--color-muted);line-height:1.9">${state.confirmMsg}</div>
        </div>
        <div style="display:flex;gap:10px;padding:18px 22px">
          <button class="btn-primary" style="flex:1" onclick="doConfirm()">حذف</button>
          <button class="btn-secondary" style="flex:1" onclick="closeConfirm()">انصراف</button>
        </div>
      </div></div>`;
    }
    if (state.toastOpen) {
      const iconBg = state.toastKind === 'warn' ? 'var(--color-warning-strong)' : 'var(--color-success-strong)';
      const icon = state.toastKind === 'warn' ? '!' : '✓';
      html += `<div class="toast"><span class="toast-icon" style="background:${iconBg}">${icon}</span><span style="font-size:13px;font-weight:600">${state.toast}</span></div>`;
    }
    document.getElementById('overlayRoot').innerHTML = html;
  }

  function renderChrome() {
    document.getElementById('crumbGroup').textContent = routeGroup();
    document.getElementById('crumbPage').textContent = routeTitle();
    renderSidebar();
  }

  function renderScreen() {
    const map = {
      dashboard: renderDashboard,
      home: renderHome,
      sections: renderSections,
      contact: renderContact,
      faq: renderFaq,
      blog: renderBlog,
      blogAdd: renderBlogAdd,
      certs: renderCerts,
    };
    document.getElementById('screenRoot').innerHTML = (map[state.route] || renderDashboard)();
  }

  function render() {
    renderChrome();
    renderScreen();
    renderOverlays();
  }

  window.toast = toast;
  render();
})();

  </script>
</body>
</html>
